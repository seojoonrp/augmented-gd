name: Build Geode Mod

# Windows only: the mod uses Windows-only input / cursor APIs, and the baked UI
# fonts (resources/fonts/gen, gitignored) are produced by scripts/fontgen.py,
# which runs here before the build. See docs/HARNESS.md "CI".

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bake the UI fonts
        run: |
          pip install pillow fonttools
          python scripts/fontgen.py

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: false

      - uses: actions/upload-artifact@v7
        with:
          name: selenophile.augmented-gd
          path: ${{ steps.build.outputs.build-output }}

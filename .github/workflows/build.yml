name: Build Geode Mod

# Windows only for now. The baked UI fonts (resources/fonts/gen) are gitignored,
# so fontgen.py runs before the build.

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bake the UI fonts
        run: |
          pip install pillow fonttools
          python scripts/fontgen.py

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: false

      - uses: actions/upload-artifact@v7
        with:
          name: selenophile.augmented-gd
          path: ${{ steps.build.outputs.build-output }}
